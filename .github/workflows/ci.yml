name: CI

on:
  push:
    branches: [main, feature/crowdly-release-preparation]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/src/requirements.txt
      - run: python -m pip install -r backend/src/requirements.txt httpx==0.28.1
      - run: python -m compileall -q backend/src bot/src
      - name: Unit tests
        env:
          PYTHONPATH: backend/src
        run: python -m unittest discover -s backend/src/tests -p 'test_*.py' -v

  frontend:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          BACKEND_API_URL: http://127.0.0.1:8000

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickettreat
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: tickettreat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickettreat -d tickettreat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://tickettreat:test_only_password@127.0.0.1:5432/tickettreat_ci
      DEMO_ISOLATED_API: "true"
      AUTH_CODE_SECRET: "ci-only-test-secret-not-used-outside-ci-1234"
      MFA_ENCRYPTION_KEY: "VGlja2V0VHJlYXQgQ0kgb25seSBNRkEga2V5IDEyMzQ="
      DEMO_PAYMENT_MODE: "false"
      APP_ENV: production
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/src/requirements.txt httpx==0.28.1
      - name: Database and HTTP integration
        run: python -m unittest discover -s backend/src/tests -p 'integration_*.py' -v
      - name: Apply versioned SQL migrations, then reapply idempotently
        run: |
          python backend/migrations/apply.py
          python backend/migrations/apply.py
      - name: Preflight registration integrity without exposing personal data
        run: python scripts/preflight_database.py
      - name: Verify migration ledger
        env:
          PGPASSWORD: test_only_password
        run: |
          expected="$(find backend/migrations -maxdepth 1 -name '20*.sql' -type f | wc -l | tr -d '[:space:]')"
          psql -h 127.0.0.1 -U tickettreat -d tickettreat_ci -tAc "SELECT count(*) FROM tickettreat_schema_migrations" | grep -qx "$expected"
      - name: Backup and restore rehearsal on disposable PostgreSQL
        env:
          PGPASSWORD: test_only_password
        run: |
          mkdir -p "$RUNNER_TEMP/private-backups"
          python scripts/backup_postgres.py --output-dir "$RUNNER_TEMP/private-backups"
          createdb -h 127.0.0.1 -U tickettreat -O tickettreat -T template0 tickettreat_restore_ci
          pg_restore -h 127.0.0.1 -U tickettreat --no-owner --no-acl -d tickettreat_restore_ci "$RUNNER_TEMP"/private-backups/*.dump
          for table in users registrations demo_tickets demo_legacy_ticket_claims demo_mfa_factors demo_privacy_requests; do
            original="$(psql -h 127.0.0.1 -U tickettreat -d tickettreat_ci -tAc "SELECT count(*) FROM $table")"
            restored="$(psql -h 127.0.0.1 -U tickettreat -d tickettreat_restore_ci -tAc "SELECT count(*) FROM $table")"
            test "$original" = "$restored"
          done

  browser-e2e:
    name: Chromium browser end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickettreat
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: tickettreat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickettreat -d tickettreat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://tickettreat:test_only_password@127.0.0.1:5432/tickettreat_ci
      DEMO_ISOLATED_API: "true"
      DEMO_PAYMENT_MODE: "false"
      APP_ENV: production
      AUTH_CODE_SECRET: "ci-browser-only-hmac-secret-123456789012345"
      BACKEND_API_URL: http://127.0.0.1:8000
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and browser dependencies
        run: |
          python -m pip install -r backend/src/requirements.txt httpx==0.28.1
          cd frontend && npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Initialize browser-only fixture and start APIs
        run: |
          python backend/src/tests/e2e_seed.py
          python -m uvicorn main:app --app-dir backend/src --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend-e2e.log" 2>&1 &
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail --silent http://127.0.0.1:8000/demo/health/ready
          (cd frontend && npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/frontend-e2e.log" 2>&1 &)
          curl --retry 40 --retry-delay 2 --retry-connrefused --fail --silent http://127.0.0.1:3000/ > /dev/null
      - name: Browser registration, session and CSRF smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Print only failure diagnostics
        if: failure()
        run: |
          tail -n 40 "$RUNNER_TEMP/backend-e2e.log" || true
          tail -n 40 "$RUNNER_TEMP/frontend-e2e.log" || true
