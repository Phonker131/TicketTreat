name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/src/requirements.txt
      - run: python -m pip install -r backend/src/requirements.txt
      - run: python -m compileall -q backend/src bot/src
      - name: Unit tests
        env:
          PYTHONPATH: backend/src
        run: python -m unittest discover -s backend/src/tests -p 'test_*.py' -v

  frontend:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          BACKEND_API_URL: http://127.0.0.1:8000

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickettreat
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: tickettreat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickettreat -d tickettreat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://tickettreat:test_only_password@127.0.0.1:5432/tickettreat_ci
      DEMO_ISOLATED_API: "true"
      AUTH_CODE_SECRET: "ci-only-test-secret-not-used-outside-ci-1234"
      DEMO_PAYMENT_MODE: "false"
      APP_ENV: production
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/src/requirements.txt httpx==0.28.1
      - name: Database and HTTP integration
        run: python -m unittest discover -s backend/src/tests -p 'integration_*.py' -v
      - name: Reapply additive SQL migration
        env:
          PGPASSWORD: test_only_password
        run: |
          psql -h 127.0.0.1 -U tickettreat -d tickettreat_ci -v ON_ERROR_STOP=1 -f backend/migrations/20261021_release_preparation.sql
          psql -h 127.0.0.1 -U tickettreat -d tickettreat_ci -v ON_ERROR_STOP=1 -f backend/migrations/20261021_release_preparation.sql
