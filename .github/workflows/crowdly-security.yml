name: Crowdly Demo security checks
on:
  push:
    branches:
      - crowdly-demo-mvp-20261020
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/crowdly-security.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
permissions:
  contents: read
jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/src/requirements.txt'
      - name: Install backend dependencies
        run: python -m pip install -r backend/src/requirements.txt
      - name: Python syntax
        run: python -m compileall -q backend/src
      - name: Password compatibility tests
        working-directory: backend/src
        run: python -m unittest discover -s tests -p 'test_demo_auth_security.py' -v
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://demo-api-production-9534.up.railway.app
          NEXT_PUBLIC_BOT_USERNAME: crowdly_bot
        run: npm run build
