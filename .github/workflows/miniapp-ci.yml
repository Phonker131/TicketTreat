name: Mini App integration checks
on:
  push:
    branches: ["crowdly-miniapp-integration", "feature/crowdly-release-preparation"]
  pull_request:
    branches: ["crowdly-demo-mvp-20261020", "crowdly-miniapp-integration", "main"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/src/requirements.txt"
      - name: Install backend requirements
        run: python -m pip install -r backend/src/requirements.txt
      - name: Python syntax validation
        run: python -m compileall -q backend/src bot/src
      - name: Telegram signature and password compatibility tests
        env:
          PYTHONPATH: backend/src
        run: python -m unittest discover -s backend/src/tests -p "test_*.py" -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Production Next.js build
        env:
          NEXT_PUBLIC_API_URL: "https://example.invalid"
        run: npm run build
        working-directory: frontend

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickettreat
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: tickettreat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickettreat -d tickettreat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://tickettreat:test_only_password@127.0.0.1:5432/tickettreat_ci
      DEMO_ISOLATED_API: "true"
      AUTH_CODE_SECRET: "ci-only-test-secret-not-used-outside-ci-1234"
      DEMO_PAYMENT_MODE: "false"
      APP_ENV: "production"
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/src/requirements.txt
      - run: python -m pip install httpx==0.28.1
      - name: Initialize and smoke-test PostgreSQL schema and FastAPI
        run: python -m unittest discover -s backend/src/tests -p 'integration_*.py' -v
      - name: Apply additive migration twice to validate idempotency
        env:
          PGPASSWORD: test_only_password
        run: |
          psql -h 127.0.0.1 -U tickettreat -d tickettreat_ci -v ON_ERROR_STOP=1 -f backend/migrations/20261021_release_preparation.sql
          psql -h 127.0.0.1 -U tickettreat -d tickettreat_ci -v ON_ERROR_STOP=1 -f backend/migrations/20261021_release_preparation.sql
