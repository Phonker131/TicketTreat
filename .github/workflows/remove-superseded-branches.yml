# One-off repository hygiene workflow. Must be removed after it runs.
# Only these three obsolete branches may be removed. Railway production still
# tracks crowdly-demo-mvp-20261020; main and the active release branch are excluded.
name: Remove superseded branches (one-time)

on:
  push:
    branches:
      - feature/crowdly-release-preparation
    paths:
      - .github/workflows/remove-superseded-branches.yml

permissions:
  contents: write

jobs:
  remove-superseded:
    if: github.repository == 'Phonker131/TicketTreat' && github.ref == 'refs/heads/feature/crowdly-release-preparation'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Phonker131/TicketTreat
    steps:
      - name: Verify superseded pull requests were closed
        run: |
          set -euo pipefail
          for pr in 2 3 4; do
            state="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.state')"
            if [ "$state" != closed ]; then
              echo "::error::PR #$pr is still $state; branch cleanup aborted"
              exit 1
            fi
          done
      - name: Remove only verified obsolete branch refs
        run: |
          set -euo pipefail
          while IFS=' ' read -r ref expected_sha; do
            [ -n "$ref" ] || continue
            current_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$ref" --jq '.object.sha')"
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "::error::Branch $ref changed after review; refusing deletion"
              exit 1
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$ref"
            echo "Deleted obsolete branch: $ref"
          done <<'BRANCHES'
          crowdly-miniapp-integration c0aed7c9290a7686cec8a3a5c399b76d60e1f31e
          docs/portfolio-readme-2026-10-12 f50108267f3c0d4627ec502d89f075c07cb0254f
          feature/telegram-mini-app-foundation 3d6a6256e03c87f84aa3d43671d3c6c294305875
          BRANCHES
