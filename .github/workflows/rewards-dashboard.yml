name: Rewards dashboard E2E

on:
  pull_request:
    branches: [dev/frontend-design, release/tickettreat-production]
    paths:
      - frontend/components/OrganizerRewardsClient.tsx
      - frontend/lib/api.ts
      - frontend/e2e/organizer-reward*.spec.ts
      - .github/workflows/rewards-dashboard.yml
  push:
    branches: [dev/frontend-design]
    paths:
      - frontend/components/OrganizerRewardsClient.tsx
      - frontend/lib/api.ts
      - frontend/e2e/organizer-reward*.spec.ts

permissions:
  contents: read

jobs:
  rewards:
    name: Reward creation, edit and issuance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          BACKEND_API_URL: http://127.0.0.1:8000
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/organizer-loyalty-tiers.spec.ts e2e/organizer-reward-edit.spec.ts e2e/organizer-rewards.spec.ts
        env:
          BACKEND_API_URL: http://127.0.0.1:8000
