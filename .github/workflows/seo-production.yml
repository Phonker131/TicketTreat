name: SEO production contracts
on:
  pull_request:
    branches: [release/tickettreat-production]
  push:
    branches: [release/tickettreat-production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      # Intentionally no backend during build. The fixture starts only afterwards.
      - run: npm run build
        env:
          BACKEND_API_URL: http://127.0.0.1:8100
      - run: npm run test:seo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: seo-production-traces
          path: frontend/test-results/
          retention-days: 7
